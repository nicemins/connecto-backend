# CORS 설정 (개발 환경)
cors:
  allowed-origins: http://localhost:3000

# Socket.io 설정
socketio:
  host: 0.0.0.0
  port: 9092

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 3600000
  refresh-expiration: 604800000

cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET:connecto-dev}
      region: ${AWS_REGION:ap-northeast-2}
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}

spring:
  application:
    name: connecto
  datasource:
    url: jdbc:h2:mem:connecto;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

google:
  android-client-id: ${GOOGLE_ANDROID_CLIENT_ID:}
  web-client-id: ${GOOGLE_WEB_CLIENT_ID:}

firebase:
  service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}