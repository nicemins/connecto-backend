events {
    worker_connections 1024;
}

http {
    # ─── Upstream ────────────────────────────────────────────
    upstream api_backend {
        server app:8080;
    }

    upstream socket_backend {
        server app:9092;
    }

    # ─── SSL 공통 설정 ─────────────────────────────────────────
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # ─── HTTP → HTTPS 리다이렉트 ───────────────────────────────
    server {
        listen 80;
        server_name api.connecto.app socket.connecto.app;

        # Certbot ACME 챌린지 (Let's Encrypt 인증서 발급/갱신)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── REST API: api.connecto.app ────────────────────────────
    server {
        listen 443 ssl;
        server_name api.connecto.app;

        ssl_certificate     /etc/letsencrypt/live/api.connecto.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.connecto.app/privkey.pem;

        # 보안 헤더 (Spring SecurityHeadersFilter와 중복 방지 — Nginx에서만 설정)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        location / {
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # 파일 업로드 (프로필 이미지 5MB)
            client_max_body_size 5m;
        }
    }

    # ─── Socket.IO: socket.connecto.app ───────────────────────
    server {
        listen 443 ssl;
        server_name socket.connecto.app;

        ssl_certificate     /etc/letsencrypt/live/api.connecto.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.connecto.app/privkey.pem;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        location / {
            proxy_pass          http://socket_backend;
            proxy_http_version  1.1;

            # WebSocket Upgrade 필수 헤더
            proxy_set_header    Upgrade    $http_upgrade;
            proxy_set_header    Connection "upgrade";
            proxy_set_header    Host       $host;
            proxy_set_header    X-Real-IP  $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;

            # WebSocket 장시간 연결 유지 (매칭 대기 등)
            proxy_read_timeout  86400s;
            proxy_send_timeout  86400s;
        }
    }
}
